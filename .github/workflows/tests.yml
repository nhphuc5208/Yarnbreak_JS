name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Hardware-free tests only need these; torch / TensorRT are not required.
      - name: Install dependencies
        run: pip install numpy opencv-python-headless pytest

      - name: Run pytest
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check i18n keys (vi / ko / en)
        run: node tests/check_i18n.js .
